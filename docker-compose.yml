services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  python:
    build:
      context: ./python-service
    restart: unless-stopped
    ports:
      - "8000:8000"

  server:
    build:
      context: ./web-app/server
    restart: unless-stopped
    environment:
      PORT: "5000"
      MONGODB_URI: "mongodb://mongo:27017/faceshield"
      JWT_SECRET: "dev_secret_change_me"
      PYTHON_SERVICE_URL: "http://python:8000"
      CORS_ORIGINS: "http://localhost:3000"
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - python
    volumes:
      - uploads_data:/app/uploads

  client:
    build:
      context: ./web-app/client
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: "http://localhost:5000/api"
      VITE_API_ORIGIN: "http://localhost:5000"
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  mongo_data:
  uploads_data:
